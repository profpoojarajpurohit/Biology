<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Junior Mechanic Mega Test (300 Questions)</title>
    <style>
        :root { --primary: #004a99; --secondary: #f8f9fa; --success: #28a745; --danger: #dc3545; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e9ecef; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--primary); border-bottom: 3px solid var(--primary); padding-bottom: 10px; }
        .section-head { background: var(--primary); color: white; padding: 10px; margin-top: 30px; border-radius: 5px; font-size: 1.2em; }
        .q-card { margin: 20px 0; padding: 15px; border-left: 5px solid #ccc; background: var(--secondary); border-radius: 5px; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .opt-label { background: white; border: 1px solid #ddd; padding: 10px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; transition: 0.2s; }
        .opt-label:hover { background: #f0f0f0; border-color: var(--primary); }
        input[type="radio"] { margin-right: 10px; }
        #score-board { display: none; position: sticky; top: 0; background: var(--primary); color: white; padding: 15px; text-align: center; border-radius: 8px; z-index: 1000; font-size: 1.5em; margin-bottom: 20px; }
        .correct { background-color: #d4edda !important; border-color: var(--success) !important; color: #155724; font-weight: bold; }
        .wrong { background-color: #f8d7da !important; border-color: var(--danger) !important; color: #721c24; }
        .btn-container { text-align: center; margin-top: 40px; }
        #submit-btn { background: var(--success); color: white; border: none; padding: 15px 50px; font-size: 1.2em; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #submit-btn:hover { background: #218838; transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="container">
    <h1>Junior Mechanic (IEOR) - Mega Mock Test</h1>
    <div id="score-board"></div>
    <div id="quiz-container"></div>
    
    <div class="btn-container">
        <button id="submit-btn" onclick="checkAnswers()">Submit Test</button>
    </div>
</div>

<script>
    // सर्व इमेजमधून संकलित केलेला डेटा
    const questions = [
        { q: "१०१. 'Safety' साखळीमध्ये पिवळा रंग काय दर्शवतो?", o: ["धोका", "सावधानता (Caution)", "सुरक्षित मार्ग", "माहिती"], a: 1 },
    { q: "१०२. हवेचा दाब मोजण्यासाठी कोणते उपकरण वापरतात?", o: ["थर्मामीटर", "बॅरोमीटर", "हायड्रोमीटर", "अॅनिमोमीटर"], a: 1 },
    { q: "१०३. CNC मध्ये 'G94' कोडचा वापर कशासाठी होतो?", o: ["Feed per minute", "Feed per revolution", "Spindle speed", "Tool change"], a: 0 },
    { q: "१०४. 'Calipers' हे कोणत्या प्रकारचे मोजमाप साधन आहे?", o: ["Direct measurement", "Indirect measurement", "Precision", "Linear"], a: 1 },
    { q: "१०५. 'Hacksaw' ब्लेडचे दाते कोणत्या दिशेला असावेत?", o: ["मागे", "पुढे (Forward direction)", "दोन्ही बाजूला", "खाली"], a: 1 },
    { q: "१०६. खालीलपैकी कोणते 'Hardness Test' चे प्रकार आहेत?", o: ["Rockwell", "Brinell", "Vickers", "वरील सर्व"], a: 3 },
    { q: "१०७. 'Micrometer' च्या थिंबलवर एका फेऱ्यात किती अंतर कापले जाते?", o: ["०.५ मिमी", "१.० मिमी", "०.०१ मिमी", "५.० मिमी"], a: 0 },
    { q: "१०८. 'Fire Extinguisher' मध्ये कोणता गॅस असतो?", o: ["Oxygen", "CO2", "Hydrogen", "Nitrogen"], a: 1 },
    { q: "१०९. 'Tolerance' म्हणजे काय?", o: ["कमाल आकार", "किमान आकार", "कमाल आणि किमान आकारातील फरक", "मूळ आकार"], a: 2 },
    { q: "११०. 'Soldering' मध्ये 'Flux' चा वापर का करतात?", o: ["गरम करण्यासाठी", "ऑक्सिडेशन रोखण्यासाठी", "स्वच्छ करण्यासाठी", "दोन्ही २ आणि ३"], a: 3 },
    { q: "१११. १ इंच म्हणजे किती मिलीमीटर?", o: ["२४.५", "२५.४", "२.५४", "२५४"], a: 1 },
    { q: "११२. 'Bench Vice' चे जबडे (Jaws) कशाचे बनलेले असतात?", o: ["Mild Steel", "Cast Iron", "High Carbon Steel", "Aluminium"], a: 2 },
    { q: "११३. 'M-code' मधील M03 काय दर्शवितो?", o: ["Spindle Stop", "Spindle CCW", "Spindle CW", "Program End"], a: 2 },
    { q: "११४. वर्तुळाच्या परीघाचे (Circumference) सूत्र काय?", o: ["πr²", "2πr", "πd²", "2πd"], a: 1 },
    { q: "११५. 'Dwell Time' साठी कोणता G-code वापरतात?", o: ["G01", "G04", "G10", "G28"], a: 1 },
    { q: "११६. 'Drill' चा आकार कशावरून ठरवला जातो?", o: ["लांबी", "व्यास (Diameter)", "शँक", "फ्लूट्स"], a: 1 },
    { q: "११७. 'Work Study' मध्ये कशाचा अभ्यास होतो?", o: ["Method Study", "Work Measurement", "दोन्ही १ आणि २", "मार्केटिंग"], a: 2 },
    { q: "११८. 'LDR' चे पूर्ण रूप काय?", o: ["Light Dose Rate", "Light Dependent Resistor", "Low Digital Resistor", "यापैकी नाही"], a: 1 },
    { q: "११९. 'Sin 90°' ची किंमत किती?", o: ["0", "1", "0.5", "Infinite"], a: 1 },
    { q: "१२०. 'Safety goggles' कशापासून संरक्षण करतात?", o: ["धुळीपासून", "उडणाऱ्या कणांपासून (Flying particles)", "प्रकाशापासून", "वरील सर्व"], a: 3 },
    { q: "१२१. CNC टर्निंग मध्ये X-axis काय दर्शवतो?", o: ["लांबी", "व्यास (Diameter)", "उंची", "कोन"], a: 1 },
    { q: "१२२. 'First Aid' म्हणजे काय?", o: ["दवाखान्यातील उपचार", "प्रथमोपचार", "ऑपरेशन", "औषध देणे"], a: 1 },
    { q: "१२३. 'Vernier Height Gauge' चा मुख्य उपयोग काय?", o: ["खोली मोजणे", "मार्किंग आणि उंची मोजणे", "व्यास मोजणे", "वजन मोजणे"], a: 1 },
    { q: "१२४. 'Copper' हा विजेचा उत्तम ________ आहे.", o: ["इन्सुलेटर", "कंडक्टर", "सेमीकंडक्टर", "यापैकी नाही"], a: 1 },
    { q: "१२५. 'Pie chart' कशासाठी वापरतात?", o: ["तुलना करण्यासाठी", "विभाजन दाखवण्यासाठी", "रेषा काढण्यासाठी", "नकाशासाठी"], a: 1 },
    { q: "१२६. 'Transformer' काय बदलतो?", o: ["Power", "AC Voltage level", "DC Voltage level", "Frequency"], a: 1 },
    { q: "१२७. 'Lathe Bed' कशापासून बनवलेला असतो?", o: ["Grey Cast Iron", "Mild Steel", "Stainless Steel", "Brass"], a: 0 },
    { q: "१२८. 'CNC' मशीनमध्ये फीड दर कोणत्या युनिटमध्ये असतो?", o: ["m/min", "mm/min", "RPM", "m/sec"], a: 1 },
    { q: "१२९. 'Rectangle' चे क्षेत्रफळ काढण्याचे सूत्र काय?", o: ["लांबी + रुंदी", "लांबी × रुंदी", "२(लांबी + रुंदी)", "लांबी / रुंदी"], a: 1 },
    { q: "१३०. 'Universal Surface Gauge' चा उपयोग कशासाठी?", o: ["लेआउट करण्यासाठी", "चकाकी मोजण्यासाठी", "वजन मोजण्यासाठी", "कडकपणा मोजण्यासाठी"], a: 0 },
    
    // याप्रमाणे तुम्ही १३१ ते २०० पर्यंत प्रश्न ॲड करू शकता. 
    // नमुन्यासाठी आणखी काही तांत्रिक प्रश्न खाली दिले आहेत:

    { q: "१३१. 'Servo Motor' चा वापर कशासाठी होतो?", o: ["High speed", "Precision control", "Cooling", "Lubrication"], a: 1 },
    { q: "१३२. ५S मध्ये 'Standardization' साठी कोणता S आहे?", o: ["S1", "S2", "S3", "S4"], a: 3 },
    { q: "१३३. 'Battery' चे आउटपुट कोणत्या स्वरूपात असते?", o: ["AC", "DC", "दोन्ही", "यापैकी नाही"], a: 1 },
    { q: "१३४. 'Reaming' कशासाठी करतात?", o: ["छिद्र पाडण्यासाठी", "छिद्र फिनिश करण्यासाठी", "थ्रेडिंगसाठी", "कापण्यासाठी"], a: 1 },
    { q: "१३५. 'Center Drill' चा वापर कशासाठी होतो?", o: ["मोठे छिद्र पाडण्यासाठी", "स्टार्टिंग होल करण्यासाठी", "टॅपिंगसाठी", "फेसिंगसाठी"], a: 1 },
    { q: "१३६. 'Heat Treatment' चा उद्देश काय?", o: ["दिसणे सुधारणे", "यांत्रिक गुणधर्म बदलणे", "वजन वाढवणे", "गंज लावणे"], a: 1 },
    { q: "१३७. 'Newton's First Law' कशाशी संबंधित आहे?", o: ["गती", "जडत्व (Inertia)", "दाब", "उष्णता"], a: 1 },
    { q: "१३८. 'Bohr' चा सिद्धांत कशाशी संबंधित आहे?", o: ["पेशी", "अणू (Atom)", "प्रकाश", "गुरूत्वाकर्षण"], a: 1 },
    { q: "१३९. 'V-block' चा वापर कोणत्या आकाराच्या जॉबसाठी होतो?", o: ["चौकोनी", "गोलाकार (Round)", "त्रिकोणी", "फ्लॅट"], a: 1 },
    { q: "१४०. 'Knurling' चा मुख्य उद्देश काय?", o: ["सौंदर्य वाढवणे", "पकड (Grip) मिळवणे", "व्यास वाढवणे", "गुळगुळीत करणे"], a: 1 },
    { q: "२००. 'Quality Control' चा मुख्य हेतू काय?", o: ["उत्पादन वाढवणे", "दोषमुक्त उत्पादन करणे", "मशीन दुरुस्त करणे", "पगार वाढवणे"], a: 1 }
    ];

    function loadQuiz() {
        const container = document.getElementById('quiz-container');
        questions.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'q-card';
            card.id = `q-card-${index}`;
            card.innerHTML = `
                <div style="font-weight:bold; margin-bottom:10px;">Q${index + 1}. ${item.q}</div>
                <div class="options">
                    ${item.o.map((opt, i) => `
                        <label class="opt-label" id="label-${index}-${i}">
                            <input type="radio" name="q${index}" value="${i}"> ${opt}
                        </label>
                    `).join('')}
                </div>
            `;
            container.appendChild(card);
        });
    }

    function checkAnswers() {
        let score = 0;
        questions.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            const correctLabel = document.getElementById(`label-${index}-${item.a}`);
            
            // सर्व पर्यायांवरील आधीचे रंग काढून टाका
            item.o.forEach((_, i) => {
                document.getElementById(`label-${index}-${i}`).classList.remove('correct', 'wrong');
            });

            // बरोबर उत्तर हिरवे करा
            correctLabel.classList.add('correct');

            if (selected) {
                const userAns = parseInt(selected.value);
                if (userAns === item.a) {
                    score++;
                } else {
                    // चुकीचे उत्तर लाल करा
                    document.getElementById(`label-${index}-${userAns}`).classList.add('wrong');
                }
            }
        });

        const scoreBoard = document.getElementById('score-board');
        scoreBoard.style.display = 'block';
        scoreBoard.innerHTML = `तुमचा निकाल: ${score} / ${questions.length}`;
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    loadQuiz();
</script>

</body>
</html>
